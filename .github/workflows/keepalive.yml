name: Keep-alive

# Render's free tier spins a service down after ~15 min idle (30-60s cold
# start on the next request). This pings the health endpoints every 10 min so
# the control plane and gateway stay warm. Edit URLS below if hostnames change.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping services
        run: |
          URLS="
          https://vantageedge.onrender.com/health
          https://vantageedge-1.onrender.com/health
          "
          fail=0
          for url in $URLS; do
            # 3 tries: first request may be waking a spun-down instance.
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors --retry-delay 20 --max-time 90 "$url" || echo "000")
            echo "$url -> $code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
