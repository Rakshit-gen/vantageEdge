name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-unit-test:
    name: Build, vet, unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: vantageedge
          POSTGRES_PASSWORD: changeme_db_password
          POSTGRES_DB: vantageedge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vantageedge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: vantageedge
      DB_PASSWORD: changeme_db_password
      DB_NAME: vantageedge
      DB_SSLMODE: disable
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run migrations
        run: go run ./cmd/migrator up

      - name: Integration tests
        run: go test -tags=integration -race ./...

  # Mirrors production Dockerfiles: fails CI if a dependency bump (like the
  # one that pushed go.mod's toolchain requirement to 1.25 in this pass)
  # isn't reflected in the pinned base image, instead of only surfacing at
  # deploy time.
  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [control-plane, gateway, migrator]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }} image
        run: docker build -f docker/${{ matrix.service }}.Dockerfile -t vantageedge-${{ matrix.service }}:ci .
